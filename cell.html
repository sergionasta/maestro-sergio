<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LIM Calcoli in Colonna - Smartphone Orizzontale</title>
    <!-- Tailwind CSS embedded via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600;800&display=swap');

        html {
            font-size: 13px; /* Base ridotta per smartphone landscape */
        }

        body {
            font-family: 'Fredoka', 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .grid-cell {
            aspect-ratio: 1;
            transition: all 0.15s ease-in-out;
            font-size: clamp(1.2rem, 2.5vw, 2.8rem);
        }
        .grid-cell.selected {
            border-color: #2563eb !important;
            background-color: #dbeafe !important;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.45);
            z-index: 10;
        }

        /* Large Division Notebook Grid Background */
        .division-grid-paper {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
        }

        /* Canvas overlay for touch/stylus drawing */
        #drawingCanvas {
            touch-action: none;
            pointer-events: none;
        }
        #drawingCanvas.drawing-active {
            pointer-events: auto;
            cursor: crosshair;
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        /* ========================================================= */
        /* OTTIMIZZAZIONI SPECIFICHE PER SMARTPHONE IN ORIZZONTALE   */
        /* ========================================================= */
        @media screen and (max-height: 500px) {
            header {
                padding-top: 0.25rem !important;
                padding-bottom: 0.25rem !important;
            }
            aside {
                width: 210px !important;
                padding: 0.5rem !important;
            }
            .keypad-btn {
                padding-top: 0.4rem !important;
                padding-bottom: 0.4rem !important;
                font-size: 1.2rem !important;
            }
            #gridContainer {
                padding: 0.75rem !important;
            }
        }
    </style>
</head>
<body class="bg-slate-900 h-screen w-screen overflow-hidden flex flex-col text-slate-800">

    <!-- Top Header Bar (Compatta) -->
    <header class="bg-slate-800 text-white px-3 py-1.5 flex items-center justify-between shadow-lg z-30 flex-shrink-0">
        <div class="flex items-center space-x-2">
            <div class="bg-amber-400 text-slate-900 p-1 rounded-lg flex items-center justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
            </div>
            <div>
                <h1 class="text-xs sm:text-sm font-bold tracking-wide leading-tight">LIM Calcoli in Colonna</h1>
            </div>
        </div>

        <!-- Global Action Buttons -->
        <div class="flex items-center space-x-1">
            <button onclick="toggleSidebar()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-1 px-2 rounded-lg flex items-center space-x-1 transition shadow border border-slate-600 text-[11px]">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                <span class="hidden sm:inline">Menu</span>
            </button>
            <button onclick="clearCanvas()" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-1 px-2 rounded-lg flex items-center space-x-1 transition shadow text-[11px]">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                <span class="hidden sm:inline">Pulisci</span>
            </button>
            <button onclick="resetGridValues()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-1 px-2 rounded-lg flex items-center space-x-1 transition shadow text-[11px]">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                <span class="hidden sm:inline">Svuota</span>
            </button>
            <button id="fullscreenBtn" onclick="toggleFullscreen()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1 px-2 rounded-lg flex items-center space-x-1 transition shadow text-[11px]">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-5V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <div class="flex-1 flex overflow-hidden relative bg-slate-100">

        <!-- Left Sidebar Options & Tool Controls -->
        <aside id="sidebarPanel" class="w-52 sm:w-60 bg-white border-r border-slate-200 p-2 flex flex-col justify-between shadow-xl overflow-y-auto z-30 transition-all duration-300 flex-shrink-0 text-xs">
            <div class="space-y-2">
                <!-- Operation Switcher -->
                <div>
                    <label class="block text-slate-500 font-bold text-[10px] uppercase tracking-wider mb-1">Operazione</label>
                    <div class="grid grid-cols-2 gap-1.5">
                        <button onclick="setOperation('add')" id="op-add" class="op-btn bg-blue-600 text-white py-1.5 rounded-lg font-bold text-[11px] shadow flex items-center justify-center"><span>+ Addizione</span></button>
                        <button onclick="setOperation('sub')" id="op-sub" class="op-btn bg-slate-100 text-slate-700 py-1.5 rounded-lg font-bold text-[11px] shadow flex items-center justify-center"><span>- Sottraz.</span></button>
                        <button onclick="setOperation('mul')" id="op-mul" class="op-btn bg-slate-100 text-slate-700 py-1.5 rounded-lg font-bold text-[11px] shadow flex items-center justify-center"><span>× Moltiplic.</span></button>
                        <button onclick="setOperation('div')" id="op-div" class="op-btn bg-slate-100 text-slate-700 py-1.5 rounded-lg font-bold text-[11px] shadow flex items-center justify-center"><span>÷ Divisione</span></button>
                    </div>
                </div>

                <!-- Dimensions and Decimal Settings -->
                <div class="bg-slate-50 p-2 rounded-xl border border-slate-200 space-y-1.5">
                    <h3 class="font-bold text-slate-700 border-b pb-0.5 text-[11px]">Opzioni & Cifre</h3>
                    
                    <div id="digitsControl">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-bold text-slate-500 uppercase">Cifre Colonne</span>
                            <span id="digitsDisplay" class="font-extrabold text-blue-600 text-sm">3</span>
                        </div>
                        <div class="flex items-center space-x-1 mt-0.5">
                            <button onclick="changeDigits(-1)" class="bg-white border border-slate-300 w-6 h-6 rounded-lg font-bold text-sm shadow-sm">-</button>
                            <div class="flex-1 text-center font-semibold text-slate-600 text-[10px]">Modifica cifre</div>
                            <button onclick="changeDigits(1)" class="bg-white border border-slate-300 w-6 h-6 rounded-lg font-bold text-sm shadow-sm">+</button>
                        </div>
                    </div>

                    <div id="addendRowsControl" class="pt-1 border-t">
                        <div class="flex justify-between items-center mb-0.5">
                            <span class="text-[10px] font-bold text-slate-500 uppercase">Righe Addendi</span>
                            <span id="addendRowsDisplay" class="font-extrabold text-blue-600 text-sm">2</span>
                        </div>
                        <div class="flex items-center space-x-1">
                            <button onclick="changeAddendRows(-1)" class="bg-white border border-slate-300 w-6 h-6 rounded-lg font-bold text-sm shadow-sm">-</button>
                            <div class="flex-1 text-center font-semibold text-slate-600 text-[10px]">Numero addendi</div>
                            <button onclick="changeAddendRows(1)" class="bg-white border border-slate-300 w-6 h-6 rounded-lg font-bold text-sm shadow-sm">+</button>
                        </div>
                    </div>

                    <div id="divisionRowsControl" class="hidden pt-1 border-t">
                        <div class="flex justify-between items-center mb-0.5">
                            <span class="text-[10px] font-bold text-slate-500 uppercase">Righe Calcolo</span>
                            <span id="divRowsDisplay" class="font-extrabold text-purple-600 text-sm">8</span>
                        </div>
                        <div class="flex items-center space-x-1">
                            <button onclick="changeDivRows(-1)" class="bg-white border border-slate-300 w-6 h-6 rounded-lg font-bold text-sm shadow-sm">-</button>
                            <div class="flex-1 text-center font-semibold text-slate-600 text-[10px]">Spazio passaggi</div>
                            <button onclick="changeDivRows(1)" class="bg-white border border-slate-300 w-6 h-6 rounded-lg font-bold text-sm shadow-sm">+</button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-1 border-t">
                        <span class="text-[10px] font-bold text-slate-600 uppercase">Con Virgola</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="decimalToggle" onchange="toggleDecimals()" class="sr-only peer">
                            <div class="w-7 h-3.5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-2.5 after:w-2.5 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>
                </div>

                <!-- Freehand Drawing Pen Controls -->
                <div class="bg-slate-50 p-2 rounded-xl border border-slate-200 space-y-1.5">
                    <h3 class="font-bold text-slate-700 border-b pb-0.5 text-[11px]">Pennello LIM</h3>
                    <div class="grid grid-cols-3 gap-1">
                        <button id="tool-pointer" onclick="setTool('pointer')" class="tool-btn bg-slate-100 text-slate-700 font-bold py-1 rounded-lg text-[10px] flex flex-col items-center justify-center">Punt.</button>
                        <button id="tool-pen" onclick="setTool('pen')" class="tool-btn bg-blue-100 border border-blue-600 text-blue-700 font-bold py-1 rounded-lg text-[10px] flex flex-col items-center justify-center">Penna</button>
                        <button id="tool-eraser" onclick="setTool('eraser')" class="tool-btn bg-slate-100 text-slate-700 font-bold py-1 rounded-lg text-[10px] flex flex-col items-center justify-center">Gomma</button>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex space-x-1">
                            <button onclick="setColor('#1e293b')" class="color-btn w-4 h-4 rounded-full bg-slate-800 ring-2 ring-blue-500"></button>
                            <button onclick="setColor('#2563eb')" class="color-btn w-4 h-4 rounded-full bg-blue-600"></button>
                            <button onclick="setColor('#dc2626')" class="color-btn w-4 h-4 rounded-full bg-red-600"></button>
                            <button onclick="setColor('#16a34a')" class="color-btn w-4 h-4 rounded-full bg-green-600"></button>
                        </div>
                        <input type="range" id="lineWidth" min="2" max="15" value="2" onchange="setLineWidth(this.value)" class="w-20 accent-blue-600">
                    </div>
                </div>
            </div>

            <div class="space-y-1.5 pt-2">
                <button onclick="generateRandomOperation()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-1.5 rounded-xl shadow transition text-[11px]">Genera Esercizio</button>
                <button onclick="checkResult()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1.5 rounded-xl shadow transition text-[11px]">Verifica</button>
                <button onclick="toggleSolution()" id="solutionBtn" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-1 rounded-xl transition text-[10px]">Soluzione</button>
            </div>
        </aside>

        <!-- Main Interactive Blackboard Workspace -->
        <main class="flex-1 relative bg-slate-200 overflow-auto flex flex-col items-center justify-center p-2">
            <canvas id="drawingCanvas" class="absolute inset-0 z-30"></canvas>

            <!-- Mathematical Grid Box -->
            <div id="gridContainer" class="relative z-20 bg-white p-3 rounded-2xl shadow-xl border-2 border-slate-300 max-w-full overflow-x-auto my-auto min-w-[280px]">
                <!-- Dynamic Content Injected Here by JS -->
            </div>
            
            <!-- External carry pad for multiplication -->
            <div id="externalCarryContainer" onclick="selectExternalCarry()" class="hidden absolute bottom-2 right-2 z-20 bg-white p-1.5 rounded-xl shadow-lg border border-amber-300 flex items-center space-x-1 cursor-pointer">
                <span class="text-[10px] font-bold text-amber-700 uppercase">Riporti:</span>
                <input type="text" id="externalCarryInput" onfocus="selectExternalCarry()" maxlength="5" class="w-14 text-center font-bold text-sm bg-amber-50 border border-amber-300 rounded-lg py-0.5 px-1 focus:outline-none">
            </div>
        </main>

        <!-- Right Sidebar Panel (Tastierino) -->
        <aside id="keypadPanel" class="w-48 sm:w-56 bg-white border-l border-slate-200 p-2 flex flex-col justify-between shadow-xl z-30 flex-shrink-0 overflow-y-auto">
            
            <!-- Top Avatar & Info (Molto Compatta) -->
            <div class="flex items-center space-x-2 border-b border-slate-100 pb-1.5">
                <img src="sergio.png" alt="Maestro Sergio" class="w-9 h-9 object-contain rounded-full border border-amber-400 bg-amber-50 flex-shrink-0">
                <div class="overflow-hidden">
                    <span class="font-extrabold text-slate-800 text-xs block truncate">Maestro Sergio</span>
                    <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener noreferrer" class="hover:opacity-80">
                        <img src="https://www.gnu.org/graphics/gplv3-or-later-sm.png" alt="GPLv3" class="h-3.5 object-contain">
                    </a>
                </div>
            </div>

            <!-- Bottom Keypad Section -->
            <div class="mt-auto space-y-1.5 pt-1">
                <div id="solutionBox" class="hidden bg-emerald-500 text-white p-1.5 rounded-xl shadow border border-white flex items-center justify-between">
                    <div>
                        <span class="text-[9px] font-bold uppercase block opacity-90">Soluzione</span>
                        <span id="solutionValue" class="text-xs font-extrabold"></span>
                    </div>
                    <button onclick="toggleSolution()" class="text-white text-xs font-bold p-0.5">×</button>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1 pb-0.5 border-b">
                        <span id="activeCellLabel" class="text-[10px] font-bold text-blue-600 truncate">Seleziona Casella</span>
                    </div>

                    <div class="grid grid-cols-3 gap-1">
                        <button onclick="typeDigit('7')" class="keypad-btn bg-slate-100 hover:bg-blue-600 hover:text-white font-extrabold text-base py-1.5 rounded-lg shadow-sm transition">7</button>
                        <button onclick="typeDigit('8')" class="keypad-btn bg-slate-100 hover:bg-blue-600 hover:text-white font-extrabold text-base py-1.5 rounded-lg shadow-sm transition">8</button>
                        <button onclick="typeDigit('9')" class="keypad-btn bg-slate-100 hover:bg-blue-600 hover:text-white font-extrabold text-base py-1.5 rounded-lg shadow-sm transition">9</button>
                        
                        <button onclick="typeDigit('4')" class="keypad-btn bg-slate-100 hover:bg-blue-600 hover:text-white font-extrabold text-base py-1.5 rounded-lg shadow-sm transition">4</button>
                        <button onclick="typeDigit('5')" class="keypad-btn bg-slate-100 hover:bg-blue-600 hover:text-white font-extrabold text-base py-1.5 rounded-lg shadow-sm transition">5</button>
                        <button onclick="typeDigit('6')" class="keypad-btn bg-slate-100 hover:bg-blue-600 hover:text-white font-extrabold text-base py-1.5 rounded-lg shadow-sm transition">6</button>
                        
                        <button onclick="typeDigit('1')" class="keypad-btn bg-slate-100 hover:bg-blue-600 hover:text-white font-extrabold text-base py-1.5 rounded-lg shadow-sm transition">1</button>
                        <button onclick="typeDigit('2')" class="keypad-btn bg-slate-100 hover:bg-blue-600 hover:text-white font-extrabold text-base py-1.5 rounded-lg shadow-sm transition">2</button>
                        <button onclick="typeDigit('3')" class="keypad-btn bg-slate-100 hover:bg-blue-600 hover:text-white font-extrabold text-base py-1.5 rounded-lg shadow-sm transition">3</button>
                        
                        <button onclick="typeDigit(',')" class="keypad-btn bg-slate-100 hover:bg-blue-600 hover:text-white font-extrabold text-base py-1.5 rounded-lg shadow-sm transition">,</button>
                        <button onclick="typeDigit('0')" class="keypad-btn bg-slate-100 hover:bg-blue-600 hover:text-white font-extrabold text-base py-1.5 rounded-lg shadow-sm transition">0</button>
                        <button onclick="typeDigit('DEL')" class="keypad-btn bg-rose-100 hover:bg-rose-600 hover:text-white text-rose-600 font-extrabold text-sm py-1.5 rounded-lg shadow-sm transition flex items-center justify-center">⌫</button>
                    </div>
                </div>

                <div id="feedbackBox" class="hidden p-1.5 rounded-xl font-bold text-center text-[10px] shadow-sm"></div>
            </div>
        </aside>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let currentOp = 'add';
        let maxDigits = 3;
        let addendRowsCount = 2;
        let divRows = 6; // Ridotto per ottimizzare lo spazio in altezza su smartphone
        let showDecimals = false;
        let activeCell = null;
        let isExternalCarrySelected = false;

        let divisionArcs = [];
        let cellValues = {};

        let canvas, ctx;
        let isDrawing = false;
        let currentTool = 'pointer';
        let currentColor = '#1e293b';
        let currentLineWidth = 2;

        window.onload = () => {
            initCanvas();
            renderGrid();
            window.addEventListener('resize', resizeCanvas);
        };

        function initCanvas() {
            canvas = document.getElementById('drawingCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function startDrawing(e) {
            if (currentTool === 'pointer') return;
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing || currentTool === 'pointer') return;
            const pos = getPos(e);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = currentLineWidth * 5;
                ctx.globalAlpha = 1.0;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = currentLineWidth;
                ctx.globalAlpha = 1.0;
            }
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDrawing() {
            if (isDrawing) {
                ctx.closePath();
                isDrawing = false;
            }
        }

        function handleTouchStart(e) {
            if (e.touches.length === 1 && currentTool !== 'pointer') {
                e.preventDefault();
                startDrawing(e.touches[0]);
            }
        }

        function handleTouchMove(e) {
            if (e.touches.length === 1 && currentTool !== 'pointer') {
                e.preventDefault();
                draw(e.touches[0]);
            }
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.remove('bg-blue-100', 'border', 'border-blue-600', 'text-blue-700');
                btn.classList.add('bg-slate-100', 'text-slate-700');
            });
            const activeBtn = document.getElementById(`tool-${tool}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-100', 'text-slate-700');
                activeBtn.classList.add('bg-blue-100', 'border', 'border-blue-600', 'text-blue-700');
            }
            if (tool === 'pointer') canvas.classList.remove('drawing-active');
            else canvas.classList.add('drawing-active');
        }

        function setColor(color) {
            currentColor = color;
            if (currentTool === 'eraser' || currentTool === 'pointer') setTool('pen');
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('ring-2', 'ring-blue-500'));
            event.target.classList.add('ring-2', 'ring-blue-500');
        }

        function setLineWidth(val) {
            currentLineWidth = parseInt(val);
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function saveGridValuesToMemory() {
            cellValues = {};
            document.querySelectorAll('.grid-cell').forEach((cell, idx) => {
                if (cell.innerText.trim() !== '') {
                    const rowKey = cell.dataset.rowKey || 'general';
                    if (!cellValues[rowKey]) cellValues[rowKey] = {};
                    cellValues[rowKey][idx] = cell.innerText.trim();
                }
            });
        }

        function setOperation(op) {
            saveGridValuesToMemory();
            currentOp = op;
            document.querySelectorAll('.op-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-slate-100', 'text-slate-700');
            });
            document.getElementById(`op-${op}`).classList.remove('bg-slate-100', 'text-slate-700');
            document.getElementById(`op-${op}`).classList.add('bg-blue-600', 'text-white');

            const divRowsCtrl = document.getElementById('divisionRowsControl');
            const addendRowsCtrl = document.getElementById('addendRowsControl');

            if (op === 'div') {
                divRowsCtrl.classList.remove('hidden');
                addendRowsCtrl.classList.add('hidden');
            } else if (op === 'add') {
                divRowsCtrl.classList.add('hidden');
                addendRowsCtrl.classList.remove('hidden');
            } else {
                divRowsCtrl.classList.add('hidden');
                addendRowsCtrl.classList.add('hidden');
            }
            renderGrid();
        }

        function changeDigits(delta) {
            saveGridValuesToMemory();
            maxDigits = Math.max(2, Math.min(5, maxDigits + delta));
            document.getElementById('digitsDisplay').innerText = maxDigits;
            divisionArcs = [];
            renderGrid();
        }

        function changeAddendRows(delta) {
            saveGridValuesToMemory();
            addendRowsCount = Math.max(2, Math.min(4, addendRowsCount + delta));
            document.getElementById('addendRowsDisplay').innerText = addendRowsCount;
            renderGrid();
        }

        function changeDivRows(delta) {
            saveGridValuesToMemory();
            divRows = Math.max(3, Math.min(10, divRows + delta));
            document.getElementById('divRowsDisplay').innerText = divRows;
            renderGrid();
        }

        function toggleDecimals() {
            saveGridValuesToMemory();
            showDecimals = document.getElementById('decimalToggle').checked;
            renderGrid();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebarPanel');
            sidebar.classList.toggle('-ml-52');
            sidebar.classList.toggle('sm:-ml-60');
            setTimeout(resizeCanvas, 300);
        }

        function updateExternalCarryVisibility() {
            const extCarry = document.getElementById('externalCarryContainer');
            if (extCarry) {
                if (currentOp === 'mul') extCarry.classList.remove('hidden');
                else extCarry.classList.add('hidden');
            }
        }

        function selectExternalCarry() {
            if (activeCell) {
                activeCell.classList.remove('selected');
                activeCell = null;
            }
            isExternalCarrySelected = true;
            const container = document.getElementById('externalCarryContainer');
            if (container) container.classList.add('ring-2', 'ring-blue-500', 'bg-amber-100');
            document.getElementById('activeCellLabel').innerText = "Ripoti";
        }

        function deselectExternalCarry() {
            isExternalCarrySelected = false;
            const container = document.getElementById('externalCarryContainer');
            if (container) container.classList.remove('ring-2', 'ring-blue-500', 'bg-amber-100');
        }

        function getSecondFactorDigitCount() {
            let digits = '';
            if (cellValues['mul-factor-2-row']) {
                const keys = Object.keys(cellValues['mul-factor-2-row']).sort((a, b) => a - b);
                digits = keys.map(k => cellValues['mul-factor-2-row'][k]).join('').trim();
            } else {
                const cells = Array.from(document.querySelectorAll('.grid-cell[data-row-key="mul-factor-2-row"]'));
                digits = cells.map(c => c.innerText.trim()).join('');
            }
            const count = digits.replace(/[^0-9]/g, '').length;
            return count > 0 ? count : 2;
        }

        function addDivisionArc(length) {
            let nextStart = 0;
            if (divisionArcs.length > 0) {
                const lastArc = divisionArcs[divisionArcs.length - 1];
                nextStart = lastArc.end + 1;
            }
            if (nextStart + length <= maxDigits) {
                divisionArcs.push({ start: nextStart, end: nextStart + length - 1 });
                saveGridValuesToMemory();
                renderGrid();
            }
        }

        function clearDivisionArcs() {
            divisionArcs = [];
            saveGridValuesToMemory();
            renderGrid();
        }

        function renderGrid() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';
            activeCell = null;
            deselectExternalCarry();
            document.getElementById('activeCellLabel').innerText = "Seleziona Casella";
            document.getElementById('solutionBox').classList.add('hidden');
            document.getElementById('feedbackBox').classList.add('hidden');

            updateExternalCarryVisibility();

            if (currentOp === 'add') renderAdditionGrid(container);
            else if (currentOp === 'sub') renderStandardGrid(container);
            else if (currentOp === 'div') renderLargeDivisionGrid(container);
            else if (currentOp === 'mul') renderMultiplicationGrid(container);

            restoreGridValuesFromMemory();
        }

        function restoreGridValuesFromMemory() {
            document.querySelectorAll('.grid-cell').forEach((cell, idx) => {
                const rowKey = cell.dataset.rowKey || 'general';
                if (cellValues[rowKey] && cellValues[rowKey][idx] !== undefined) {
                    cell.innerText = cellValues[rowKey][idx];
                }
            });
        }

        function renderAdditionGrid(container) {
            const cols = 1 + maxDigits + (showDecimals ? 2 : 0) + 1;
            const grid = document.createElement('div');
            grid.className = `grid gap-1.5 items-center justify-center font-bold`;
            grid.style.gridTemplateColumns = `repeat(${cols}, minmax(36px, 55px))`;

            for (let i = 0; i < cols; i++) {
                if (i === cols - 1 || i === cols - 2 - (showDecimals ? 2 : 0)) {
                    grid.appendChild(createEmptyCell());
                } else {
                    grid.appendChild(createCell('carry', 'add-carry-row', 'text-rose-600 text-xs border border-dashed border-rose-300 bg-rose-50 rounded-lg h-7'));
                }
            }

            for (let r = 0; r < addendRowsCount; r++) {
                const isLastAddend = (r === addendRowsCount - 1);
                for (let i = 0; i < cols; i++) {
                    if (i === 0) {
                        grid.appendChild(createEmptyCell());
                    } else if (i === cols - 1) {
                        const symbolBox = document.createElement('div');
                        symbolBox.className = 'text-center font-extrabold text-blue-600 text-xl';
                        symbolBox.innerText = isLastAddend ? '=' : '+';
                        grid.appendChild(symbolBox);
                    } else {
                        grid.appendChild(createCell(`operand-${r + 1}`, `addend-row-${r}`, 'border border-slate-300 bg-slate-50 text-slate-800 rounded-xl h-10 sm:h-12 text-xl font-bold'));
                    }
                }
            }

            const line = document.createElement('div');
            line.className = 'col-span-full border-b-2 border-slate-800 my-0.5 rounded-full';
            grid.appendChild(line);

            for (let i = 0; i < cols; i++) {
                if (i === cols - 1) grid.appendChild(createEmptyCell());
                else grid.appendChild(createCell('result', 'add-result-row', 'border border-blue-500 bg-blue-50 text-blue-900 font-extrabold rounded-xl h-10 sm:h-12 text-xl'));
            }
            container.appendChild(grid);
        }

        function renderStandardGrid(container) {
            const cols = maxDigits + (showDecimals ? 2 : 0) + 1;
            const grid = document.createElement('div');
            grid.className = `grid gap-1.5 items-center justify-center font-bold`;
            grid.style.gridTemplateColumns = `repeat(${cols}, minmax(36px, 55px))`;

            for (let i = 0; i < cols; i++) {
                if (i === cols - 1 || i === cols - 2) grid.appendChild(createEmptyCell());
                else grid.appendChild(createCell('carry', 'sub-carry-row', 'text-rose-600 text-xs border border-dashed border-rose-300 bg-rose-50 rounded-lg h-7'));
            }

            for (let i = 0; i < cols; i++) {
                if (i === cols - 1) {
                    const symbolBox = document.createElement('div');
                    symbolBox.className = 'text-center font-extrabold text-blue-600 text-xl';
                    symbolBox.innerText = '-';
                    grid.appendChild(symbolBox);
                } else {
                    grid.appendChild(createCell('operand-1', 'sub-minuend-row', 'border border-slate-300 bg-slate-50 text-slate-800 rounded-xl h-10 sm:h-12 text-xl font-bold'));
                }
            }

            for (let i = 0; i < cols; i++) {
                if (i === cols - 1) {
                    const symbolBox = document.createElement('div');
                    symbolBox.className = 'text-center font-extrabold text-blue-600 text-xl';
                    symbolBox.innerText = '=';
                    grid.appendChild(symbolBox);
                } else {
                    grid.appendChild(createCell('operand-2', 'sub-subtrahend-row', 'border border-slate-300 bg-slate-50 text-slate-800 rounded-xl h-10 sm:h-12 text-xl font-bold'));
                }
            }

            const line = document.createElement('div');
            line.className = 'col-span-full border-b-2 border-slate-800 my-0.5 rounded-full';
            grid.appendChild(line);

            for (let i = 0; i < cols; i++) {
                if (i === cols - 1) grid.appendChild(createEmptyCell());
                else grid.appendChild(createCell('result', 'sub-result-row', 'border border-blue-500 bg-blue-50 text-blue-900 font-extrabold rounded-xl h-10 sm:h-12 text-xl'));
            }
            container.appendChild(grid);
        }

        function renderMultiplicationGrid(container) {
            const partialRows = getSecondFactorDigitCount();
            const cols = 1 + maxDigits + (showDecimals ? 2 : 0) + 1;
            const grid = document.createElement('div');
            grid.className = `grid gap-1.5 items-center justify-center font-bold`;
            grid.style.gridTemplateColumns = `repeat(${cols}, minmax(36px, 55px))`;

            for (let i = 0; i < cols; i++) {
                if (i === cols - 1 || i === cols - 2) grid.appendChild(createEmptyCell());
                else grid.appendChild(createCell('carry', 'mul-carry-row', 'text-rose-600 text-xs border border-dashed border-rose-300 bg-rose-50 rounded-lg h-7'));
            }

            for (let i = 0; i < cols; i++) {
                if (i === cols - 1) {
                    const symbolBox = document.createElement('div');
                    symbolBox.className = 'text-center font-extrabold text-blue-600 text-xl';
                    symbolBox.innerText = '×';
                    grid.appendChild(symbolBox);
                } else if (i === 0) {
                    grid.appendChild(createEmptyCell());
                } else {
                    grid.appendChild(createCell('operand-1', 'mul-factor-1-row', 'border border-slate-300 bg-slate-50 text-slate-800 rounded-xl h-10 sm:h-12 text-xl font-bold'));
                }
            }

            for (let i = 0; i < cols; i++) {
                if (i === cols - 1) {
                    const symbolBox = document.createElement('div');
                    symbolBox.className = 'text-center font-extrabold text-blue-600 text-xl';
                    symbolBox.innerText = '=';
                    grid.appendChild(symbolBox);
                } else if (i === 0) {
                    grid.appendChild(createEmptyCell());
                } else {
                    grid.appendChild(createCell('operand-2', 'mul-factor-2-row', 'border border-slate-300 bg-slate-50 text-slate-800 rounded-xl h-10 sm:h-12 text-xl font-bold'));
                }
            }

            const line1 = document.createElement('div');
            line1.className = 'col-span-full border-b-2 border-slate-800 my-0.5 rounded-full';
            grid.appendChild(line1);

            for (let r = 0; r < partialRows; r++) {
                for (let i = 0; i < cols; i++) {
                    if (i === cols - 1) {
                        const symbolBox = document.createElement('div');
                        symbolBox.className = 'text-center font-extrabold text-slate-500 text-lg';
                        symbolBox.innerText = (partialRows === 1 || r === partialRows - 1) ? '=' : '+';
                        grid.appendChild(symbolBox);
                    } else {
                        grid.appendChild(createCell('partial-prod', `mul-partial-row-${r}`, 'border border-amber-300 bg-amber-50/60 text-amber-900 rounded-xl h-10 sm:h-12 text-xl font-bold'));
                    }
                }
            }

            if (partialRows > 1) {
                const line2 = document.createElement('div');
                line2.className = 'col-span-full border-b-2 border-slate-800 my-0.5 rounded-full';
                grid.appendChild(line2);
            }

            for (let i = 0; i < cols; i++) {
                if (i === cols - 1) grid.appendChild(createEmptyCell());
                else grid.appendChild(createCell('result', 'mul-result-row', 'border border-blue-500 bg-blue-50 text-blue-900 font-extrabold rounded-xl h-10 sm:h-12 text-xl'));
            }
            container.appendChild(grid);
        }

        function renderLargeDivisionGrid(container) {
            const cellWidthClass = 'w-9 h-9 sm:w-12 sm:h-12';
            const cellTextSize = 'text-base sm:text-xl font-bold';
            
            const divWrapper = document.createElement('div');
            divWrapper.className = 'flex gap-3 items-start justify-center min-w-[260px] max-w-full';

            const leftSide = document.createElement('div');
            leftSide.className = 'flex flex-col gap-2 flex-1 w-full';

            const workArea = document.createElement('div');
            workArea.className = 'division-grid-paper border border-slate-200 rounded-xl p-2 flex flex-col gap-1 min-h-[180px] shadow-inner';

            const templateStyle = `grid-template-columns: 15px repeat(${maxDigits}, minmax(36px, 50px));`;

            const arcHeader = document.createElement('div');
            arcHeader.className = 'col-span-full flex items-center justify-between border-b pb-1 min-h-[22px]';

            const labelDiv = document.createElement('span');
            labelDiv.className = 'text-[9px] font-bold text-slate-400 uppercase tracking-wider';
            labelDiv.innerText = 'DIVIDENDO:';
            arcHeader.appendChild(labelDiv);

            const arcControls = document.createElement('div');
            arcControls.className = 'flex items-center space-x-1';
            arcControls.innerHTML = `
                <button onclick="addDivisionArc(1)" class="bg-amber-100 text-amber-900 font-bold px-1 py-0.5 rounded text-[9px]">⌒ 1</button>
                <button onclick="addDivisionArc(2)" class="bg-amber-100 text-amber-900 font-bold px-1 py-0.5 rounded text-[9px]">⌒ 2</button>
                <button onclick="clearDivisionArcs()" class="bg-rose-100 text-rose-700 font-bold px-1 py-0.5 rounded text-[9px]">✕</button>
            `;
            arcHeader.appendChild(arcControls);
            workArea.appendChild(arcHeader);

            const arcVisualRow = document.createElement('div');
            arcVisualRow.className = 'grid gap-1.5 items-center col-span-full h-3';
            arcVisualRow.style.cssText = templateStyle;
            arcVisualRow.appendChild(document.createElement('div'));

            for (let c = 0; c < maxDigits; c++) {
                const arcCell = document.createElement('div');
                arcCell.className = 'w-full h-full flex items-end justify-center';
                const matchedArc = divisionArcs.find(a => c >= a.start && c <= a.end);
                if (matchedArc) {
                    const isStart = (c === matchedArc.start);
                    const isEnd = (c === matchedArc.end);
                    let roundedClass = 'rounded-t-none';
                    if (isStart && isEnd) roundedClass = 'rounded-t-full';
                    else if (isStart) roundedClass = 'rounded-tl-full';
                    else if (isEnd) roundedClass = 'rounded-tr-full';
                    arcCell.innerHTML = `<div class="w-full h-2 border-t-2 border-amber-500 ${roundedClass}"></div>`;
                }
                arcVisualRow.appendChild(arcCell);
            }
            workArea.appendChild(arcVisualRow);

            const dividendGridRow = document.createElement('div');
            dividendGridRow.className = 'grid gap-1.5 items-center col-span-full pb-1 border-b border-slate-200';
            dividendGridRow.style.cssText = templateStyle;
            dividendGridRow.appendChild(document.createElement('div'));

            for (let i = 0; i < maxDigits; i++) {
                dividendGridRow.appendChild(createCell('operand-1', 'main-input', `border border-slate-300 bg-slate-50 text-slate-800 rounded-lg ${cellWidthClass} ${cellTextSize}`));
            }
            workArea.appendChild(dividendGridRow);

            for (let r = 0; r < divRows; r++) {
                const subRow = document.createElement('div');
                subRow.className = 'grid gap-1.5 items-center';
                subRow.style.cssText = templateStyle;

                const rowLabel = document.createElement('div');
                rowLabel.className = 'text-center font-bold text-slate-400 text-sm flex-shrink-0';
                rowLabel.innerText = (r % 2 === 0 && r > 0) ? '-' : (r % 2 === 1 ? '=' : '');
                subRow.appendChild(rowLabel);

                for (let c = 0; c < maxDigits; c++) {
                    subRow.appendChild(createCell('div-step', `div-sub-row-${r}`, `border border-slate-300 bg-white/80 text-slate-700 rounded-lg ${cellWidthClass} ${cellTextSize}`));
                }
                workArea.appendChild(subRow);
            }
            leftSide.appendChild(workArea);

            const rightSide = document.createElement('div');
            rightSide.className = 'flex flex-col bg-purple-50/60 border-l-2 border-slate-800 p-2 rounded-r-xl w-36 gap-2';

            const divisorContainer = document.createElement('div');
            divisorContainer.className = 'flex flex-col gap-1 pb-2 border-b-2 border-slate-800';
            divisorContainer.innerHTML = `<div class="text-[9px] font-bold text-purple-700 uppercase">DIVISORE</div><div class="h-2"></div>`;
            
            const divisorRow = document.createElement('div');
            divisorRow.className = 'flex gap-1';
            for (let i = 0; i < Math.max(2, Math.floor(maxDigits / 2)); i++) {
                divisorRow.appendChild(createCell('operand-2', 'div-divisor-row', `border border-purple-400 bg-purple-100 text-purple-900 rounded-lg ${cellWidthClass} ${cellTextSize}`));
            }
            divisorContainer.appendChild(divisorRow);
            rightSide.appendChild(divisorContainer);

            const quotientContainer = document.createElement('div');
            quotientContainer.className = 'flex flex-col gap-1';
            quotientContainer.innerHTML = `<div class="text-[9px] font-bold text-emerald-700 uppercase">QUOZIENTE</div>`;

            const quotientRow = document.createElement('div');
            quotientRow.className = 'flex gap-1 overflow-x-auto pb-1';
            for (let i = 0; i < maxDigits + 1; i++) {
                quotientRow.appendChild(createCell('quotient', 'quotient-row', `border border-emerald-500 bg-emerald-100 text-emerald-900 rounded-lg flex-shrink-0 ${cellWidthClass} text-lg font-extrabold`));
            }
            quotientContainer.appendChild(quotientRow);
            rightSide.appendChild(quotientContainer);

            divWrapper.appendChild(leftSide);
            divWrapper.appendChild(rightSide);
            container.appendChild(divWrapper);
        }

        function createCell(type, rowKey, customClasses) {
            const cell = document.createElement('div');
            cell.className = `grid-cell flex items-center justify-center cursor-pointer select-none text-center shadow-sm ${customClasses}`;
            cell.dataset.type = type;
            cell.dataset.rowKey = rowKey;
            cell.innerText = '';
            cell.onclick = (e) => {
                e.stopPropagation();
                selectCell(cell);
            };
            return cell;
        }

        function createEmptyCell() {
            const cell = document.createElement('div');
            cell.className = 'w-full h-full';
            return cell;
        }

        function selectCell(cell) {
            deselectExternalCarry();
            if (activeCell) activeCell.classList.remove('selected');
            activeCell = cell;
            activeCell.classList.add('selected');
            document.getElementById('activeCellLabel').innerText = "Casella Attiva";
        }

        function typeDigit(val) {
            const carryInput = document.getElementById('externalCarryInput');
            if (isExternalCarrySelected || document.activeElement === carryInput) {
                if (val === 'DEL') carryInput.value = carryInput.value.slice(0, -1);
                else if (val !== ',' && carryInput.value.length < 5) carryInput.value += val;
                return;
            }

            if (!activeCell) return;
            if (val === 'DEL') {
                activeCell.innerText = '';
                return;
            }
            activeCell.innerText = val;

            const rowKey = activeCell.dataset.rowKey;
            if (!rowKey || rowKey.includes('carry')) return;

            const rowCells = Array.from(document.querySelectorAll(`.grid-cell[data-row-key="${rowKey}"]`));
            const currentIndex = rowCells.indexOf(activeCell);
            if (currentIndex !== -1 && currentIndex < rowCells.length - 1) {
                selectCell(rowCells[currentIndex + 1]);
            }
        }

        function resetGridValues() {
            cellValues = {};
            divisionArcs = [];
            document.querySelectorAll('.grid-cell').forEach(cell => cell.innerText = '');
            document.getElementById('externalCarryInput').value = '';
            deselectExternalCarry();
            document.getElementById('feedbackBox').classList.add('hidden');
            document.getElementById('solutionBox').classList.add('hidden');
        }

        function generateRandomOperation() {
            resetGridValues();
            clearCanvas();
            renderGrid();

            if (currentOp === 'add') {
                const minVal = Math.pow(10, maxDigits - 1);
                const maxVal = Math.pow(10, maxDigits) - 1;
                for (let r = 0; r < addendRowsCount; r++) {
                    fillOperandCells(`operand-${r + 1}`, (Math.floor(Math.random() * (maxVal - minVal + 1)) + minVal).toString());
                }
            } else if (currentOp === 'mul') {
                let num1 = Math.floor(Math.random() * 40) + 12;
                let num2 = Math.floor(Math.random() * 8) + 2;
                fillOperandCells('operand-1', num1.toString());
                fillOperandCells('operand-2', num2.toString());
                saveGridValuesToMemory();
                renderGrid();
            } else if (currentOp === 'sub') {
                const minVal = Math.pow(10, maxDigits - 1);
                const maxVal = Math.pow(10, maxDigits) - 1;
                let num1 = Math.floor(Math.random() * (maxVal - minVal + 1)) + minVal;
                let num2 = Math.floor(Math.random() * (num1 - minVal + 1)) + minVal;
                fillOperandCells('operand-1', num1.toString());
                fillOperandCells('operand-2', num2.toString());
            } else if (currentOp === 'div') {
                let num1 = Math.floor(Math.random() * 200) + 40;
                let num2 = Math.floor(Math.random() * 7) + 2;
                fillOperandCells('operand-1', num1.toString());
                fillOperandCells('operand-2', num2.toString());
            }
        }

        function fillOperandCells(targetType, valueStr) {
            const cells = Array.from(document.querySelectorAll(`.grid-cell[data-type="${targetType}"]`));
            const digits = valueStr.split('');
            let offset = cells.length - digits.length;
            for (let i = 0; i < digits.length; i++) {
                if (cells[offset + i]) cells[offset + i].innerText = digits[i];
            }
        }

        function getNumberFromCells(type) {
            const cells = Array.from(document.querySelectorAll(`.grid-cell[data-type="${type}"]`));
            const str = cells.map(c => c.innerText.trim()).join('').replace(',', '.');
            return str ? parseFloat(str) : 0;
        }

        function checkResult() {
            const feedback = document.getElementById('feedbackBox');
            feedback.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-rose-100', 'text-rose-800');

            let userResult = getNumberFromCells(currentOp === 'div' ? 'quotient' : 'result');
            if (currentOp === 'mul' && userResult === 0 && getSecondFactorDigitCount() === 1) {
                userResult = getNumberFromCells('partial-prod');
            }

            let expected = 0;
            if (currentOp === 'add') {
                for (let r = 0; r < addendRowsCount; r++) expected += getNumberFromCells(`operand-${r + 1}`);
            } else if (currentOp === 'sub') {
                expected = getNumberFromCells('operand-1') - getNumberFromCells('operand-2');
            } else if (currentOp === 'mul') {
                expected = getNumberFromCells('operand-1') * getNumberFromCells('operand-2');
            } else if (currentOp === 'div') {
                expected = Math.floor(getNumberFromCells('operand-1') / getNumberFromCells('operand-2'));
            }

            if (Math.abs(userResult - expected) < 0.01 && userResult !== 0) {
                feedback.classList.add('bg-emerald-100', 'text-emerald-800');
                feedback.innerHTML = '✓ Corretto!';
            } else {
                feedback.classList.add('bg-rose-100', 'text-rose-800');
                feedback.innerHTML = '⚠ Riprova!';
            }
        }

        function toggleSolution() {
            const box = document.getElementById('solutionBox');
            const valBox = document.getElementById('solutionValue');
            if (box.classList.contains('hidden')) {
                let res = 0;
                if (currentOp === 'add') {
                    for (let r = 0; r < addendRowsCount; r++) res += getNumberFromCells(`operand-${r + 1}`);
                } else if (currentOp === 'sub') {
                    res = getNumberFromCells('operand-1') - getNumberFromCells('operand-2');
                } else if (currentOp === 'mul') {
                    res = getNumberFromCells('operand-1') * getNumberFromCells('operand-2');
                } else if (currentOp === 'div') {
                    let num1 = getNumberFromCells('operand-1'), num2 = getNumberFromCells('operand-2');
                    res = num2 === 0 ? 'Impossibile' : `${Math.floor(num1 / num2)} (r. ${num1 % num2})`;
                }
                valBox.innerText = res;
                box.classList.remove('hidden');
            } else {
                box.classList.add('hidden');
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
